# Position selection on one risk-adjusted scale: stablecoin LOOPS vs plain
# SUPPLY-ONLY deposits, $300k split across three chains, under the LIVE policy
# (config/live-router.yaml: baseline 4.5%, venue tiers, caps, depeg table,
# deposit premia, routes).
#
#   Market numbers: research snapshot 2026-10-29 00:00 UTC (docs/selection.md §4,
#   docs/lending-landscape.md). Aave / Merkl "NET_APR" campaigns are TARGETS for
#   the total APR, so the reward below is the part actually paid
#   (dailyRewards x 365 / TVL), not Merkl's `apr` field. Pool sizes not in the
#   sources are rounded from withdrawable liquidity and utilization.
#   EXAMPLE NUMBERS ONLY — not live data, not advice.
#
# Every candidate goes through the real math (sources/supply.ts,
# sources/loopPair.ts), including the expected depeg loss (stables table) and
# reward time-weighting (most Aave campaigns are weekly and end today).
#
# Run: npx tsx packages/core/src/cli.ts sim examples/scenarios/selection-2026-10-29.yaml --why
name: Selection 2026-10-29 — loops vs supply-only under the live policy (example numbers)
router_config: ../../config/live-router.yaml
start_at: "2026-10-29T00:00:00Z"
idle:
  "arbitrum:USDC": 150000
  "plasma:USDT0": 100000
  "sui:USDC": 50000
step_minutes: 60
steps: 4

tokens:
  USDe: {priceUsd: 1.0, depth2pctUsd: 50000000, vol: 0.02, trendApr: 0}
  WMON: {priceUsd: 0.03, depth2pctUsd: 2000000, vol: 1.0, trendApr: -0.3}
  WXPL: {priceUsd: 0.25, depth2pctUsd: 3000000, vol: 1.0, trendApr: -0.5}
  CERT: {priceUsd: 3.0, depth2pctUsd: 1000000, vol: 0.8, trendApr: -0.2}

# Scenario-only routes (live-router.yaml routes are loaded through router_config):
# destination swaps into GHO / RLUSD / USDsui and Monad via USDT0 (disabled in the live router).
routes:
