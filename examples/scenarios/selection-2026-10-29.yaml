  - {id: sc-swap-eth-rlusd-usdc, kind: swap, from: {chain: ethereum, asset: RLUSD}, to: {chain: ethereum, asset: USDC}, feeBps: 3, feeFixedUsd: 0, gasSrcUsd: 1, gasDstUsd: 0, etaMinutes: 1, enabled: true}
  - {id: sc-swap-plasma-usdt0-gho, kind: swap, from: {chain: plasma, asset: USDT0}, to: {chain: plasma, asset: GHO}, feeBps: 3, feeFixedUsd: 0, gasSrcUsd: 0.02, gasDstUsd: 0, etaMinutes: 1, enabled: true}
