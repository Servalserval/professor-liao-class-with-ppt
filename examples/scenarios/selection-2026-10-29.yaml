  - {id: sc-usdt0-arb-monad, kind: usdt0_oft, from: {chain: arbitrum, asset: USDT0}, to: {chain: monad, asset: USDT0}, feeBps: 0, feeFixedUsd: 0.5, gasSrcUsd: 0.1, gasDstUsd: 0, etaMinutes: 5, enabled: true}
