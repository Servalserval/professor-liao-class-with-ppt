  - {id: sc-swap-eth-gho-usdc, kind: swap, from: {chain: ethereum, asset: GHO}, to: {chain: ethereum, asset: USDC}, feeBps: 3, feeFixedUsd: 0, gasSrcUsd: 1, gasDstUsd: 0, etaMinutes: 1, enabled: true}
