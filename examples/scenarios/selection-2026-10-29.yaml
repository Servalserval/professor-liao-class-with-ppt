# Position selection on one risk-adjusted scale: stablecoin LOOPS vs plain
# SUPPLY-ONLY deposits, $300k split across three chains.
#
#   EXAMPLE NUMBERS ONLY. Loops follow docs/lending-landscape.md (2026-10-29);
#   supply-only candidates are provisional snapshot numbers from the
#   orchestrator brief. Pool sizes / utilizations not in those sources are
#   illustrative. Nothing here is live market data or advice.
#
# Router settings mirror config/live-router.yaml (baseline 4.5%, tiers, caps,
# loop settings, routes). Every candidate goes through the real math
# (sources/supply.ts, sources/loopPair.ts) incl. the depeg-risk haircut
# (stables table in DEFAULT_CONFIG). Opportunity ids are static:<protocol>:<marketId|pairId>,
# so marketIds / pairIds are chain-qualified here (one static source for all chains).
#
# Run: npx tsx packages/core/src/cli.ts sim examples/scenarios/selection-2026-10-29.yaml --verbose
name: Selection 2026-10-29 — loops vs supply-only on one scale (example numbers)
start_at: "2026-10-29T00:00:00Z"
idle:
  "arbitrum:USDC": 150000
  "plasma:USDT0": 100000
  "sui:USDC": 50000
step_minutes: 60
steps: 4

config:
  baseline_apr: 0.045
  hold_horizon_days: 21
  caps:
    per_venue_frac_by_tier: {1: 0.40, 2: 0.15, 3: 0.05}
    per_opportunity_frac: 0.40
    max_concurrent_positions: 8
    min_position_usd: 1000
    max_position_usd: 120000
    min_idle_frac: 0.05
  venues:
    aave-v3: {enabled: true, tier: 1}
    aave-v4: {enabled: true, tier: 2}
    navi:    {enabled: true, tier: 2, chain: sui}
    # not in live-router.yaml yet (assumption for this example):
    euler:   {enabled: true, tier: 2}
    fluid:   {enabled: true, tier: 2}
  gas_usd: {default: 0.05, ethereum: 0.5, arbitrum: 0.05, base: 0.03, plasma: 0.02, monad: 0.02, mantle: 0.05, avalanche: 0.05, sui: 0.02}
  sources:
    lending_loop:
      target_ltv: 0.70
      max_ltv_frac_of_open: 0.85
      deleverage_at_ltv: 0.78
      critical_ltv_frac_of_close: 0.95
      utilization_warn: 0.90
      utilization_exit: 0.95
      footprint: gross
      txs_per_entry: 40
      txs_per_exit: 40
  rewards:
    tokens:
      USDe: {policy: hold, max_hold_usd: 1000000, claim_interval_hours: 168, claim_min_usd: 20}

tokens:
  USDe: {priceUsd: 1.0, depth2pctUsd: 50000000, vol: 0.02, trendApr: 0}
  USDC: {priceUsd: 1.0, depth2pctUsd: 1000000000, vol: 0.0, trendApr: 0}
  WMON: {priceUsd: 0.03, depth2pctUsd: 2000000, vol: 1.0, trendApr: -0.3}
  NAVX: {priceUsd: 0.05, depth2pctUsd: 300000, vol: 1.2, trendApr: -0.5}

# config/live-router.yaml routes (copied), then scenario-only assumptions.
routes:
  - {id: cctp-std-arb-base, kind: cctp_v2_standard, from: {chain: arbitrum, asset: USDC}, to: {chain: base, asset: USDC}, feeBps: 0, feeFixedUsd: 0, gasSrcUsd: 0.05, gasDstUsd: 0.05, etaMinutes: 25, enabled: true}
  - {id: cctp-std-base-arb, kind: cctp_v2_standard, from: {chain: base, asset: USDC}, to: {chain: arbitrum, asset: USDC}, feeBps: 0, feeFixedUsd: 0, gasSrcUsd: 0.05, gasDstUsd: 0.05, etaMinutes: 25, enabled: true}
  - {id: cctp-std-arb-sui, kind: cctp_v2_standard, from: {chain: arbitrum, asset: USDC}, to: {chain: sui, asset: USDC}, feeBps: 0, feeFixedUsd: 0, gasSrcUsd: 0.05, gasDstUsd: 0.02, etaMinutes: 25, enabled: true}
  - {id: cctp-std-sui-arb, kind: cctp_v2_standard, from: {chain: sui, asset: USDC}, to: {chain: arbitrum, asset: USDC}, feeBps: 0, feeFixedUsd: 0, gasSrcUsd: 0.02, gasDstUsd: 0.05, etaMinutes: 3, enabled: true}
  - {id: cctp-std-eth-arb, kind: cctp_v2_standard, from: {chain: ethereum, asset: USDC}, to: {chain: arbitrum, asset: USDC}, feeBps: 0, feeFixedUsd: 0, gasSrcUsd: 4, gasDstUsd: 0.05, etaMinutes: 25, enabled: true}
  - {id: cctp-std-arb-eth, kind: cctp_v2_standard, from: {chain: arbitrum, asset: USDC}, to: {chain: ethereum, asset: USDC}, feeBps: 0, feeFixedUsd: 0, gasSrcUsd: 0.05, gasDstUsd: 5, etaMinutes: 25, enabled: true}
  - {id: usdt0-arb-plasma, kind: usdt0_oft, from: {chain: arbitrum, asset: USDT0}, to: {chain: plasma, asset: USDT0}, feeBps: 0, feeFixedUsd: 0.5, gasSrcUsd: 0.1, gasDstUsd: 0, etaMinutes: 5, enabled: true}
