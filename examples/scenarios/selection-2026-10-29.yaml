  - {id: swap-mantle-usdt0-usde, kind: swap, from: {chain: mantle, asset: USDT0}, to: {chain: mantle, asset: USDe}, feeBps: 4, feeFixedUsd: 0, gasSrcUsd: 0.05, gasDstUsd: 0, etaMinutes: 1, enabled: true}
