  - {id: sc-swap-sui-usdc-usdsui, kind: swap, from: {chain: sui, asset: USDC}, to: {chain: sui, asset: USDsui}, feeBps: 5, feeFixedUsd: 0, gasSrcUsd: 0.02, gasDstUsd: 0, etaMinutes: 1, enabled: true}
