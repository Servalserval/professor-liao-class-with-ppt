# incentive-router default config
# All APRs are yearly fractions (0.05 = 5%). All caps are fractions of TOTAL equity.
# Anything omitted falls back to DEFAULT_CONFIG in src/config.ts.
#
# Mapping from loop-farm config/default.yaml is in docs/design.md §7.

# What idle money earns elsewhere (T-bill / sUSDS). Thresholds are premia on top of it.
baseline_apr: 0.045
hold_horizon_days: 21          # one-off costs are amortized over this; reward time-weight uses it
poll_seconds: 60

thresholds:
  entry_premium_by_tier: {1: 0.03, 2: 0.06, 3: 0.12}   # enter if net >= baseline + premium
  exit_premium_by_tier:  {1: 0.00, 2: 0.02, 3: 0.05}   # leave if net <  baseline + premium (hysteresis)
  hard_floor_apr: 0.0          # below this: close fully instead of trimming
  spread_reduce_step: 0.5      # trim size per confirmed spread breach
  confirm_cycles: 2            # non-urgent reasons must persist this many cycles...
  confirm_minutes: 10          # ...and at least this long (a 60s poll alone would be a 2-min debounce)
  # Added to the tier premia per kind (entry never below baseline_apr). A plain
  # deposit has no liquidation / swap / leverage risk, so it clears a lower bar:
  # tier 1 deposit entry = 4.5% + 3% - 1.5% = 6%, exit = 4.5% + 0% - 1% = 3.5%.
  kind_premium_adjust:
    deposit: {entry: -0.015, exit: -0.01}

# The generalized 1/10 -> 1/5 rule. "capacity" = what can get out (lending: available
# liquidity; LP: depth for the volatile side; perp: min book depth of both venues).
liquidity:
  entry_max_frac_of_capacity: 0.10
  exit_frac_of_capacity: 0.20          # >= -> FULL EXIT, never debounced
  min_capacity_usd: 200000
  capacity_drop_exit_frac: 0.30        # capacity -30% within the window -> FULL EXIT (bank run)
  capacity_drop_window_minutes: 60
  estimated_capacity_haircut: 0.5      # discovery data guesses capacity; halve it

rewards:
  default_realizable: 0.5              # loop-farm's flat haircut, used only for unknown tokens
  min_realizable: 0.1
  max_realizable: 0.95
  ending_hours: 12                     # campaign ending soon -> exit if the edge needs it
  claim_gas_multiple: 5                # never claim < 5x gas (crash: 1x)
  vol_penalty_k: 1.0
  price_crash_frac: 0.25               # reward token -25% in 24h -> claim and dump
  urgent_claim_min_interval_hours: 6   # crash / over-cap claims still wait this long between claims
  emission_drop_frac: 0.5              # pool reward APR halves within the window -> warn
  emission_drop_window_hours: 24
  default_token: {policy: sell_on_claim, max_hold_usd: 0, claim_interval_hours: 24, claim_min_usd: 50}
  tokens:
    # SEND:  {policy: sell_on_claim, claim_interval_hours: 12}
    # 1INCH: {policy: hedge}          # needs tokens.1INCH.perpAvailable: true in the token profile feed
    # NAVX:  {policy: hold, max_hold_usd: 500}

points:
  max_cost_apr: 0.03          # pay at most 3%/yr of the position for a points lottery ticket
  budget_frac: 0.10           # at most 10% of equity in points-driven positions

funding:
  realizable: 0.7             # positive funding valued at 70% (it flips); negative counted in full

spike_window_minutes: 60      # spike = current minus the LOW of this window (catches ramps too)
spike_rules:                  # metric jump -> FULL EXIT
  borrow_apr: 0.10            # loop-farm: borrow APR +10pp
  # funding_flip_apr: 0.50    # perp hedges: funding diff collapses by 50pp annualized

caps:
  per_venue_frac_by_tier: {1: 0.40, 2: 0.15, 3: 0.05}
  per_chain_frac: {default: 0.60}
  per_token_frac: 0.80
  per_reward_token_frac: 0.05         # unclaimed + held - hedged of any single reward token
  per_kind_frac: {lending_loop: 0.80, lp_incentive: 0.40, delta_neutral_perp: 0.40, deposit: 0.50}
  per_opportunity_frac: 0.30
  max_concurrent_positions: 8
  min_position_usd: 500
  max_position_usd: 100000
  min_idle_frac: 0.05
  reentry_cooldown_hours: 6
  urgent_reentry_cooldown_hours: 48   # after a liquidity / stress exit
  # max_total_deployed_usd: 5000      # optional hard ceiling on deployed + in-flight USD (canary runs)

allocator:
  chunk_frac: 0.02            # water-fill in 2%-of-equity chunks
  min_chunk_usd: 500
  max_new_positions_per_cycle: 2
  min_rebalance_usd: 1000

exit_probe:                   # devInspect / eth_call of the full unwind
  max_age_minutes: 30
  max_consecutive_failures: 2   # simulations that returned "cannot exit"
  error_alert_after: 3          # simulations that could not run (RPC error): warn only, never an exit

portfolio:
  kill_drawdown_frac: 0.05    # equity -5% within the window -> exit all, pause
  kill_window_hours: 24
  blind_alert_cycles: 3       # source missing a held opportunity
  blind_exit_cycles: 10
  alert_repeat_hours: 6       # status alerts are deduped per (opportunity, rule) within this window
  max_data_age_minutes: 10    # adapters set dataAsOfMs; older data = blind
  health_missing: warn        # held loop / perp hedge without a health metric: warn | exit
  kill_confirm_cycles: 2      # the drawdown must be seen on this many consecutive cycles before the kill switch fires

tiers:                        # see src/tiers.ts for the score
  tier1_min_score: 7
  tier2_min_score: 4

gas_usd: {default: 0.5, ethereum: 8, sui: 0.05, arbitrum: 0.1, base: 0.05}

venues:
  navi:     {enabled: true, tier: 1, chain: sui}
  suilend:  {enabled: true, tier: 1, chain: sui}
  aave-v3:  {enabled: true, tier: 1}
  hyperliquid: {enabled: true, tier: 1}
  # A new venue without a tier is scored from meta (unknown -> tier 3):
  # some-new-lender: {enabled: true, meta: {audits: 1, age_days: 40, tvl_usd: 30000000, admin_multisig: true, timelock_hours: 0, upgradeable: true}}

sources:
  lending_loop:
    target_ltv: 0.70
    max_ltv_frac_of_open: 0.85
    deleverage_at_ltv: 0.78
    critical_ltv_frac_of_close: 0.95
    utilization_warn: 0.90
    utilization_exit: 0.95
    footprint: gross          # gross: L x equity must fit (conservative); net: flashloan exit
    rate_uncertainty_mult: 1.30
    txs_per_entry: 1
    txs_per_exit: 1
    unknown_swap_cost_frac: 0.003   # assumed when every swap probe failed (NaN) and no recent quote exists; entries are blocked meanwhile
  discovery:
    min_tvl_usd: 1000000
    chains: []
    assumed_withdrawable_frac: 0.3
  supply:                         # supply-only lending (deposit, no borrow): sources/supply.ts
    utilization_warn: 0.95        # blocks new deposits (a deposit lowers utilization; the 1/10 + 1/5 liquidity rules guard exits)
    utilization_exit: 0.99        # leave: the pool is close to locked (not used for vaults)
    max_risk_tier: 2              # refuse deposits into stables whose depeg tier is above this
    unknown_stable_tier: 3        # a stable missing from `stables` is treated as tier 3
    txs_per_entry: 2              # approve + deposit
    txs_per_exit: 1

# Stablecoin depeg risk (deposits AND loops), researched 2026-10-29 (docs/selection.md §4).
# Keys are case-insensitive (USDT also covers USDt); two keys differing only by case are an error.
# The expected loss is charged as a running cost:
#   deposit / same-asset loop: 1 x loss(asset); two-asset loop: L x loss(collateral).
# Per stable: tier (1|2|3), expected_loss_apr (default tiers_default_loss[tier]),
# depeg_warn / depeg_exit (|price-1| levels; deposits use them as is, loops use the stricter of
# these and sources.lending_loop.depeg_*), and
# max_frac (cap on that asset across ALL positions, share of total equity).
stables:   # researched 2026-10-29 (docs/selection.md §3)
  USDC:    {tier: 1, expected_loss_apr: 0.0005, depeg_warn: 0.003, depeg_exit: 0.01}
  USDT:    {tier: 1, expected_loss_apr: 0.001, depeg_warn: 0.003, depeg_exit: 0.01}
  USDS:    {tier: 1, expected_loss_apr: 0.001, depeg_warn: 0.003, depeg_exit: 0.01}
  DAI:     {tier: 1, expected_loss_apr: 0.001, depeg_warn: 0.003, depeg_exit: 0.01}
  PYUSD:   {tier: 1, expected_loss_apr: 0.0008, depeg_warn: 0.003, depeg_exit: 0.01}
  RLUSD:   {tier: 1, expected_loss_apr: 0.0008, depeg_warn: 0.003, depeg_exit: 0.01}
  USDG:    {tier: 1, expected_loss_apr: 0.0008, depeg_warn: 0.003, depeg_exit: 0.01}
  USDC.e:  {tier: 2, expected_loss_apr: 0.002, depeg_warn: 0.005, depeg_exit: 0.015}
  USDT0:   {tier: 2, expected_loss_apr: 0.003, depeg_warn: 0.005, depeg_exit: 0.015}
  GHO:     {tier: 2, expected_loss_apr: 0.003, depeg_warn: 0.005, depeg_exit: 0.015}
  AUSD:    {tier: 2, expected_loss_apr: 0.003, depeg_warn: 0.005, depeg_exit: 0.015}
  USDsui:  {tier: 2, expected_loss_apr: 0.003, depeg_warn: 0.005, depeg_exit: 0.015}
  mUSD:    {tier: 2, expected_loss_apr: 0.003, depeg_warn: 0.005, depeg_exit: 0.015}
  frxUSD:  {tier: 2, expected_loss_apr: 0.003, depeg_warn: 0.005, depeg_exit: 0.015}
  USDtb:   {tier: 2, expected_loss_apr: 0.003, depeg_warn: 0.005, depeg_exit: 0.015}
  USD1:    {tier: 2, expected_loss_apr: 0.003, depeg_warn: 0.005, depeg_exit: 0.015}
  suiUSDT: {tier: 2, expected_loss_apr: 0.003, depeg_warn: 0.005, depeg_exit: 0.015}
  USDe:    {tier: 3, expected_loss_apr: 0.015, depeg_warn: 0.007, depeg_exit: 0.02}
  sUSDe:   {tier: 3, expected_loss_apr: 0.02, depeg_warn: 0.007, depeg_exit: 0.02}
  crvUSD:  {tier: 3, expected_loss_apr: 0.015, depeg_warn: 0.007, depeg_exit: 0.02}
  FDUSD:   {tier: 3, expected_loss_apr: 0.015, depeg_warn: 0.007, depeg_exit: 0.02}
  wUSDC:   {tier: 3, expected_loss_apr: 0.02, depeg_warn: 0.007, depeg_exit: 0.02}
  wUSDT:   {tier: 3, expected_loss_apr: 0.02, depeg_warn: 0.007, depeg_exit: 0.02}
tiers_default_loss: {1: 0.0008, 2: 0.003, 3: 0.015}   # expected depeg loss APR for a stable with a tier but no expected_loss_apr

telegram:
  bot_token_env: TG_BOT_TOKEN
  chat_id_env: TG_CHAT_ID

# Cross-chain funding (packages/core/src/xchain). Off by default: the router then
# behaves exactly as before (one idle bucket, no bridging). When idle money is
# tracked per chain:asset, money already on the right chain is used first (free);
# moving money from another chain is allowed only if ALL rules below hold.
xchain:
  enabled: false
  # Rule 1 (the hard one): the all-in cost of one move (bridge fee + gas on both
  # chains + swap slippage + the yield lost while the money is in flight) must
  # not exceed this many DAYS of the net yield that money earns where it lands.
  # 1 = "a move may cost at most one day of its own yield".
  max_cost_days_of_yield: 1
  # Rule 2: everything spent on moves in any rolling 24h must not exceed this
  # many days of the WHOLE book's expected yield (stops death by many small moves).
  book_daily_budget_days: 1
  # Rule 3: the move must pay for itself within this many days from the APR
  # improvement over leaving the money idle where it is (see idle_apr).
  payback_days: 14
  # Rule 4: never move less than this (fixed fees and gas dominate small moves).
  min_move_usd: 1000
  # Rule 5: at most this share of total equity may be on bridges at the same time.
  max_in_flight_frac: 0.5
  # A hop not finished after max(stuck_min_minutes, eta x stuck_eta_multiple) is
  # flagged STUCK (critical alert). It is never re-sent automatically.
  stuck_eta_multiple: 4
  stuck_min_minutes: 60
  # What idle cash earns where it sits while deciding (0 = nothing).
  idle_apr: 0
  # Known routes between chain:asset nodes. Paths may chain up to 3 routes.
  # Each route: {id, kind, from: {chain, asset}, to: {chain, asset}, feeBps,
  # feeFixedUsd, gasSrcUsd, gasDstUsd, etaMinutes, minUsd?, maxUsd?, enabled, notes?}
  # kind: cctp_v2_fast | cctp_v2_standard | cctp_v1 | usdt0_oft | wormhole | across
  #       | stargate | cex | swap | noop. Filled in by the orchestrator / live adapters.
  routes: []
